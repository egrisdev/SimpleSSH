# Dependabot checks for new versions once a week and opens a pull request per group.
# The Build workflow runs the tests on each one; merge the ones that pass.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      app:
        patterns: ["SSH.NET", "Microsoft.Web.WebView2", "System.Security.Cryptography.*"]
      installer:
        patterns: ["WixToolset.*"]
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*"]
    ignore:
      # These follow the app's .NET version; move them when the app moves.
      - dependency-name: "System.Security.Cryptography.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /tools/testserver
    schedule:
      interval: weekly
      day: monday
    groups:
      test-server:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
