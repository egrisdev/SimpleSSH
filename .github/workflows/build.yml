name: Build

# Every push and pull request: run the tests and build the installer.
# A tag like v1.5.0 also publishes the installer as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed only to create the release on a tag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pick the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = ([xml](Get-Content src/SimpleSSH/SimpleSSH.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test and build the installer
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: SimpleSSH-${{ steps.version.outputs.version }}-x64
          path: artifacts/installer/SimpleSSH-${{ steps.version.outputs.version }}-x64.msi
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          "artifacts/installer/SimpleSSH-${{ steps.version.outputs.version }}-x64.msi"
          --title "SimpleSSH ${{ steps.version.outputs.version }}"
          --generate-notes
